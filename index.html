<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World News Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --card: #1a2235; --text: #e8ecf4; --dim: #8896b0;
    --muted: #4a5568; --accent: #3b82f6; --border: #1e2d45;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }

  /* Header */
  #header { position:fixed; top:0; left:0; right:0; z-index:1000;
    background:linear-gradient(180deg,rgba(10,14,23,.97) 0%,rgba(10,14,23,.85) 80%,rgba(10,14,23,0) 100%);
    padding:12px 20px 24px; pointer-events:none; }
  #header-inner { pointer-events:auto; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .logo { display:flex; align-items:center; gap:8px; }
  .logo-icon { width:28px; height:28px; background:var(--accent); border-radius:7px;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    box-shadow:0 0 16px rgba(59,130,246,.3); }
  .logo-text { font-family:'Space Mono',monospace; font-size:14px; font-weight:700; letter-spacing:-.5px; }
  .logo-text span { color:var(--accent); }

  /* Buttons */
  .cat-btn { font-family:'DM Sans',sans-serif; font-size:11px; font-weight:600; padding:5px 12px;
    border-radius:16px; border:1px solid var(--border); background:transparent; color:var(--dim);
    cursor:pointer; transition:all .2s; text-transform:uppercase; letter-spacing:.4px; }
  .cat-btn:hover { border-color:var(--dim); color:var(--text); }
  .cat-btn.active { color:#fff; border-color:transparent; }
  .cat-btn[data-cat="all"].active { background:#3b82f6; }
  .cat-btn[data-cat="conflict"].active { background:#ef4444; }
  .cat-btn[data-cat="politics"].active { background:#8b5cf6; }
  .cat-btn[data-cat="economy"].active { background:#10b981; }
  .cat-btn[data-cat="environment"].active { background:#06b6d4; }
  .cat-btn[data-cat="humanitarian"].active { background:#f59e0b; }
  .cat-btn[data-cat="health"].active { background:#ec4899; }
  .cat-btn[data-cat="positive"].active { background:#22d3ee; }
  .cat-btn[data-cat="science_tech"].active { background:#6366f1; }
  .view-toggle { border-color:var(--accent)!important; color:var(--accent)!important; margin-left:4px; }

  /* Source slider */
  .slider-wrap { display:flex; align-items:center; gap:5px; margin-left:6px; }
  .slider-label { font-size:9px; color:var(--dim); white-space:nowrap; font-family:'Space Mono',monospace; }
  .slider-label span { color:var(--accent); font-weight:700; }
  .slider-input { width:70px; height:3px; -webkit-appearance:none; background:var(--border); border-radius:2px; outline:none; }
  .slider-input::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--accent); cursor:pointer; }

  /* Map */
  #map { position:absolute; top:0; left:0; right:0; bottom:0; z-index:1; background:var(--bg); }
  .leaflet-tile-pane { filter:brightness(.6) contrast(1.15) saturate(.2) hue-rotate(180deg) invert(1); }
  .leaflet-control-zoom, .leaflet-control-attribution { display:none!important; }

  /* Popups */
  .leaflet-popup-content-wrapper { background:var(--card)!important; color:var(--text)!important;
    border-radius:10px!important; border:1px solid var(--border)!important;
    box-shadow:0 12px 40px rgba(0,0,0,.5)!important; min-width:240px; max-width:340px; }
  .leaflet-popup-tip { background:var(--card)!important; }
  .leaflet-popup-close-button { color:var(--dim)!important; font-size:16px!important; top:6px!important; right:8px!important; }
  .popup-header { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .popup-city { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; }
  .popup-country { font-size:10px; color:var(--dim); }
  .popup-badge { font-size:9px; font-weight:700; padding:2px 7px; border-radius:8px; color:#fff; text-transform:uppercase; letter-spacing:.3px; }

  /* AI Headline — the hero element */
  .popup-headline { font-size:13px; font-weight:600; line-height:1.4; color:var(--text);
    margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border); min-height:18px; }
  .popup-headline.loading { color:var(--muted); font-style:italic; font-weight:400; }
  .popup-headline.loading .hl-loading::after {
    content:''; display:inline-block; width:12px;
    animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

  /* AI Summary — expandable */
  .popup-summary { font-size:11px; line-height:1.5; color:var(--dim); margin-bottom:8px;
    padding-bottom:8px; border-bottom:1px solid var(--border); }
  .groq-btn { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:600; padding:4px 10px;
    border-radius:8px; border:1px solid rgba(59,130,246,.4); background:rgba(59,130,246,.08); color:var(--accent);
    cursor:pointer; transition:all .2s; display:inline-flex; align-items:center; gap:4px; }
  .groq-btn:hover { background:rgba(59,130,246,.2); border-color:var(--accent); }
  .groq-badge { font-size:8px; color:var(--muted); margin-top:3px; }

  /* Source links */
  .popup-sources { list-style:none; }
  .popup-sources li { padding:4px 0; border-bottom:1px solid rgba(30,45,69,.3); }
  .popup-sources li:last-child { border-bottom:none; }
  .popup-sources a { color:var(--accent); text-decoration:none; font-size:11px; font-weight:500; transition:color .15s; }
  .popup-sources a:hover { color:#60a5fa; }
  .popup-sources .src-arrow { color:var(--muted); font-size:9px; float:right; margin-top:2px; }
  .popup-meta { font-size:9px; color:var(--muted); margin-top:6px; }

  /* Event cards — scrollable list of events per location */
  .events-list { max-height:320px; overflow-y:auto; }
  .event-card { padding:8px 0; border-bottom:1px solid var(--border); }
  .event-card:last-child { border-bottom:none; }
  .event-headline { font-size:12.5px; font-weight:600; line-height:1.35; color:var(--text); margin-bottom:5px; }
  .event-headline.loading { color:var(--muted); font-style:italic; font-weight:400; }
  .event-sources { display:flex; flex-wrap:wrap; gap:4px 10px; }
  .event-sources a { color:var(--accent); text-decoration:none; font-size:10px; font-weight:500; transition:color .15s; }
  .event-sources a:hover { color:#60a5fa; }
  .event-sources .src-arrow { color:var(--muted); font-size:8px; margin-left:2px; }
  .event-meta { font-size:9px; color:var(--muted); margin-top:3px; }
  /* Story list popup (heatmap mode) */
  .popup-story-list { list-style:none; max-height:260px; overflow-y:auto; }
  .popup-story-list li { padding:5px 0; border-bottom:1px solid rgba(30,45,69,.4); font-size:11px; line-height:1.35; }
  .popup-story-list li:last-child { border-bottom:none; }

  /* Leaderboard */
  .lb { position:fixed; top:60px; right:0; bottom:70px; width:260px; z-index:999;
    background:rgba(26,34,53,.95); backdrop-filter:blur(12px); border-left:1px solid var(--border);
    display:flex; flex-direction:column; transition:transform .3s; }
  .lb.hidden { transform:translateX(260px); }
  .lb-toggle { position:absolute; left:-28px; top:50%; transform:translateY(-50%);
    width:26px; height:44px; background:rgba(26,34,53,.95); border:1px solid var(--border); border-right:none;
    border-radius:6px 0 0 6px; color:var(--dim); font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .lb-toggle:hover { color:var(--text); }
  .lb-head { padding:12px 14px 8px; border-bottom:1px solid var(--border); }
  .lb-title { font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:1px; color:var(--dim); margin-bottom:6px; }
  .lb-tabs { display:flex; gap:4px; }
  .lb-tab { font-family:'DM Sans',sans-serif; font-size:10px; font-weight:600; padding:3px 8px;
    border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--dim);
    cursor:pointer; transition:all .2s; }
  .lb-tab:hover { border-color:var(--dim); color:var(--text); }
  .lb-tab.active { background:var(--accent); color:#fff; border-color:transparent; }
  .lb-list { flex:1; overflow-y:auto; padding:6px 0; }
  .lb-row { display:flex; align-items:center; padding:6px 14px; cursor:pointer; transition:background .15s; gap:8px; }
  .lb-row:hover { background:rgba(59,130,246,.08); }
  .lb-rank { font-family:'Space Mono',monospace; font-size:10px; color:var(--muted); width:18px; text-align:right; flex-shrink:0; }
  .lb-name { flex:1; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-val { font-family:'Space Mono',monospace; font-size:10px; color:var(--accent); flex-shrink:0; }
  .lb-bar-bg { width:40px; height:3px; background:var(--border); border-radius:2px; flex-shrink:0; }
  .lb-bar { height:100%; border-radius:2px; background:var(--accent); }

  /* Info panel */
  #info { position:fixed; bottom:16px; right:16px; z-index:998; background:rgba(26,34,53,.92);
    backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:10px; text-align:right; }
  .info-row { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-bottom:3px; }
  .info-val { font-family:'Space Mono',monospace; font-weight:700; color:var(--accent); }
  .info-lbl { color:var(--dim); }
  .info-time { color:var(--muted); font-size:9px; margin-top:4px; }

  /* Legend */
  #legend { position:fixed; bottom:16px; left:16px; z-index:998; background:rgba(26,34,53,.92);
    backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:10px; }
  #legend h4 { font-family:'Space Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:6px; }
  .leg-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .leg-dot { border-radius:50%; flex-shrink:0; }

  /* Cluster markers */
  .marker-cluster { background:rgba(59,130,246,.25)!important; border:2px solid rgba(59,130,246,.5)!important; }
  .marker-cluster div { background:rgba(59,130,246,.7)!important; color:#fff!important;
    font-family:'Space Mono',monospace!important; font-size:10px!important; font-weight:700!important; }
  .marker-cluster-small { background:rgba(59,130,246,.2)!important; }
  .marker-cluster-small div { background:rgba(59,130,246,.6)!important; }
  .marker-cluster-medium { background:rgba(245,158,11,.2)!important; }
  .marker-cluster-medium div { background:rgba(245,158,11,.6)!important; }
  .marker-cluster-large { background:rgba(239,68,68,.25)!important; }
  .marker-cluster-large div { background:rgba(239,68,68,.7)!important; }

  /* Loading */
  #loader { position:fixed; inset:0; z-index:2000; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .6s; }
  #loader.done { opacity:0; pointer-events:none; }
  .spin { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:sp .8s linear infinite; }
  .spin-text { margin-top:12px; font-family:'Space Mono',monospace; font-size:11px; color:var(--dim);
    letter-spacing:1px; text-transform:uppercase; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* Mobile */
  @media(max-width:768px) {
    #header { padding:8px 12px 18px; }
    .cat-btn { font-size:9px; padding:4px 8px; }
    .slider-wrap { display:none; }
    .lb { width:200px; top:55px; }
    #legend, #info { font-size:9px; padding:8px 10px; }
  }
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><div class="spin-text">Scanning the globe...</div></div>

<div id="header"><div id="header-inner">
  <div class="logo"><div class="logo-icon">◉</div><div class="logo-text"><span>WORLD</span>NEWS MAP</div></div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;">
    <button class="cat-btn active" data-cat="all">All</button>
    <button class="cat-btn" data-cat="conflict">Conflict</button>
    <button class="cat-btn" data-cat="politics">Politics</button>
    <button class="cat-btn" data-cat="economy">Economy</button>
    <button class="cat-btn" data-cat="environment">Environment</button>
    <button class="cat-btn" data-cat="humanitarian">Humanitarian</button>
    <button class="cat-btn" data-cat="health">Health</button>
    <button class="cat-btn" data-cat="science_tech">Sci/Tech</button>
    <button class="cat-btn" data-cat="positive">Positive</button>
    <button class="cat-btn view-toggle" id="viewBtn">⬡ DOTS</button>
    <div class="slider-wrap">
      <label class="slider-label">Sources ≥ <span id="srcVal">3</span></label>
      <input type="range" id="srcSlider" min="1" max="20" value="3" class="slider-input">
    </div>
  </div>
</div></div>

<div id="map"></div>

<div class="lb" id="lb">
  <button class="lb-toggle" id="lbToggle">◀</button>
  <div class="lb-head">
    <div class="lb-title">Leaderboard</div>
    <div class="lb-tabs">
      <button class="lb-tab active" data-lb="continent">Continents</button>
      <button class="lb-tab" data-lb="country">Countries</button>
    </div>
  </div>
  <div class="lb-list" id="lbList"></div>
</div>

<div id="legend">
  <h4>Intensity</h4>
  <div class="leg-row"><div class="leg-dot" style="background:#3b82f6;width:7px;height:7px;"></div><span style="color:var(--dim)">Low</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#f59e0b;width:11px;height:11px;"></div><span style="color:var(--dim)">Moderate</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#ef4444;width:16px;height:16px;"></div><span style="color:var(--dim)">High</span></div>
</div>

<div id="info">
  <div class="info-row"><span class="info-lbl">Events</span><span class="info-val" id="sEvents">0</span></div>
  <div class="info-row"><span class="info-lbl">Sources</span><span class="info-val" id="sSources">0</span></div>
  <div class="info-row"><span class="info-lbl">Countries</span><span class="info-val" id="sCountries">0</span></div>
  <div class="info-time" id="sTime">Loading...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
// ═══════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════
const CONFIG = { dataURL:'./data/live.json', refreshMs:15*60*1000, minSrc:1 };
const GROQ_PROXY_URL = 'https://still-leaf-983b.milo-borek.workers.dev'; // e.g. https://newsmap-groq-proxy.YOUR_SUBDOMAIN.workers.dev
const GROQ_MODEL = 'llama-3.3-70b-versatile';
const CC = {
  conflict:{b:'#ef4444',g:'rgba(239,68,68,.35)'},
  politics:{b:'#8b5cf6',g:'rgba(139,92,246,.35)'},
  economy:{b:'#10b981',g:'rgba(16,185,129,.35)'},
  environment:{b:'#06b6d4',g:'rgba(6,182,212,.35)'},
  humanitarian:{b:'#f59e0b',g:'rgba(245,158,11,.35)'},
  health:{b:'#ec4899',g:'rgba(236,72,153,.35)'},
  science_tech:{b:'#6366f1',g:'rgba(99,102,241,.35)'},
  positive:{b:'#22d3ee',g:'rgba(34,211,238,.35)'},
};
const DC = {b:'#3b82f6',g:'rgba(59,130,246,.35)'};
let map, markersLayer, heatLayer;
let allData=[], hotspotData=[];
let curCat='all', viewMode='dots', lbMode='continent';

// ═══════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════
function initMap(){
  map = L.map('map',{center:[20,15],zoom:3,minZoom:2,maxZoom:12,zoomControl:false,attributionControl:false,worldCopyJump:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
  markersLayer = L.layerGroup().addTo(map);

  // Auto-fire Groq headlines for each event when popup opens
  map.on('popupopen', function(e) {
    const marker = e.popup._source;
    if (marker && marker._hotspotData) {
      const s = marker._hotspotData;
      const pid = marker._popupId;
      const events = s.events || [];
      events.forEach((ev, i) => {
        const evId = `ev-${pid}-${i}`;
        const el = document.getElementById('hl-' + evId);
        // Only fire Groq if the headline element is in loading state (no pre-existing headline)
        if (el && el.classList.contains('loading')) {
          const evData = window['_ev_' + evId];
          if (evData) {
            setTimeout(() => groqHeadline(evId, evData), 50 + i * 100);
          }
        }
      });
    }
  });
}

// ═══════════════════════════════════════════
// VISUAL HELPERS
// ═══════════════════════════════════════════
function getR(i){ return i<=0?4:4+Math.sqrt(i/100)*24; }
function getC(i,cats){ const c=CC[cats&&cats[0]]||DC; return i>75?{b:lerp(c.b,'#ef4444',(i-75)/25),g:c.g}:c; }
function lerp(a,b,t){
  const ah=parseInt(a.replace('#',''),16),bh=parseInt(b.replace('#',''),16);
  const r=Math.round(((ah>>16)&0xff)+(((bh>>16)&0xff)-((ah>>16)&0xff))*t);
  const g=Math.round(((ah>>8)&0xff)+(((bh>>8)&0xff)-((ah>>8)&0xff))*t);
  const bl=Math.round((ah&0xff)+((bh&0xff)-(ah&0xff))*t);
  return `#${((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1)}`;
}

// ═══════════════════════════════════════════
// GROQ AI — TWO-STAGE SYSTEM
// Stage 1: headline (auto on popup open, ~60 tokens)
// Stage 2: full summary (on button click, ~300 tokens)
// ═══════════════════════════════════════════
const headlineCache = {};
const summaryCache = {};
let groqRateLimited = false;
let groqRateLimitResetAt = 0;

function buildGroqContext(hs) {
  const parts = [`Location: ${hs.city}, ${hs.country}`];
  if (hs.headlines?.length) {
    parts.push(`Article headlines about this event:\n- ${hs.headlines.join('\n- ')}`);
  }
  const m = hs.metadata || {};
  if (m.persons?.length) parts.push(`Key people: ${m.persons.join(', ')}`);
  if (m.counts && Object.keys(m.counts).length) {
    const cs = Object.entries(m.counts).map(([k,v])=>`${v.number} ${k.toLowerCase()}${v.object_type?' ('+v.object_type+')':''}`);
    parts.push(`Reported counts: ${cs.join(', ')}`);
  }
  if (m.categories?.length || hs.categories?.length) parts.push(`Categories: ${(hs.categories||m.categories||[]).join(', ')}`);
  if (m.avgTone) parts.push(`Average media tone: ${m.avgTone}`);
  // Handle both old (articles) and new (sources) format
  const srcList = hs.sources || hs.articles || [];
  if (srcList.length) parts.push(`${srcList.length} sources: ${srcList.map(a=>a.source).filter(Boolean).join(', ')}`);
  return parts.join('\n');
}

const HEADLINE_SYSTEM = `You are a neutral news headline writer for an English-language audience. You will receive real article headlines and metadata about a single news event. Some headlines may be in languages other than English — translate them into English first, then synthesize. Write ONE factual headline of 10-20 words in English that captures the core event. Prioritize what the headlines actually say. Use metadata (persons, counts, tone) only to add precision, not to speculate. If headlines are missing, write a brief factual description from the metadata. No editorializing, no quotation marks, no sensationalism. Output ONLY the headline text in English, nothing else.`;

const SUMMARY_SYSTEM = `You are a neutral news analyst writing for an English-language audience. You will receive article headlines and metadata about a single news event. Some headlines may be in other languages — translate and incorporate them. Write a factual 100-200 word summary in English of what is known. State what multiple sources report. Note where sources disagree if applicable. Do not speculate beyond what the headlines state. Do not editorialize. Use plain, clear language. Do not start with "Based on" or "According to the data".`;

async function groqCall(messages, maxTokens=60) {
  if (!GROQ_PROXY_URL || GROQ_PROXY_URL === 'https://still-leaf-983b.milo-borek.workers.dev') return null;
  if (groqRateLimited && Date.now() < groqRateLimitResetAt) return 'RATE_LIMITED';

  const resp = await fetch(GROQ_PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, max_tokens: maxTokens }),
  });

  if (resp.status === 429) {
    groqRateLimited = true;
    groqRateLimitResetAt = Date.now() + parseInt(resp.headers.get('Retry-After') || '60', 10) * 1000;
    return 'RATE_LIMITED';
  }
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices?.[0]?.message?.content?.trim() || null;
}

async function groqHeadline(pid, hs) {
  const el = document.getElementById('hl-' + pid);
  if (!el) return;
  const cacheKey = `hl:${hs.city||''},${(hs.headlines||[])[0]||pid}`;
  if (headlineCache[cacheKey]) { el.textContent = headlineCache[cacheKey]; el.className='event-headline'; return; }
  if (!GROQ_PROXY_URL || GROQ_PROXY_URL === 'https://still-leaf-983b.milo-borek.workers.dev') {
    el.textContent = hs.headlines?.[0] || '';
    el.className = 'event-headline';
    return;
  }

  el.innerHTML = '<span class="hl-loading">Generating headline</span>';
  el.className = 'event-headline loading';
  try {
    const result = await groqCall([
      { role: 'system', content: HEADLINE_SYSTEM },
      { role: 'user', content: buildGroqContext(hs) }
    ], 60);
    if (result === 'RATE_LIMITED') {
      el.textContent = hs.headlines?.[0] || 'Rate limited';
      el.className = 'event-headline';
      return;
    }
    const headline = result || hs.headlines?.[0] || '';
    headlineCache[cacheKey] = headline;
    el.textContent = headline;
    el.className = 'event-headline';
  } catch(e) {
    el.textContent = hs.headlines?.[0] || '';
    el.className = 'event-headline';
  }
}

async function groqSummary(pid, hs) {
  const el = document.getElementById('sum-' + pid);
  if (!el) return;
  const cacheKey = `sum:${hs.lat},${hs.lng},${(hs.headlines||[])[0]||''}`;
  if (summaryCache[cacheKey]) { el.innerHTML = summaryCache[cacheKey]; return; }

  el.innerHTML = '<span class="hl-loading" style="color:var(--muted);font-style:italic">Generating summary</span>';
  try {
    const result = await groqCall([
      { role: 'system', content: SUMMARY_SYSTEM },
      { role: 'user', content: buildGroqContext(hs) }
    ], 350);
    if (result === 'RATE_LIMITED') {
      el.innerHTML = '<span style="color:var(--muted);font-size:10px">Rate limited — try again shortly</span>';
      return;
    }
    const html = (result || 'Summary unavailable') + '<div class="groq-badge">AI analysis via Groq</div>';
    summaryCache[cacheKey] = html;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<span style="color:var(--muted);font-size:10px">${e.message||'Summary unavailable'}</span>`;
  }
}

// ═══════════════════════════════════════════
// POPUP BUILDER — shows events list per location
// ═══════════════════════════════════════════
let popupCounter = 0;
function buildPopup(s){
  const bc=(CC[s.categories?.[0]]||DC).b;
  const pid = popupCounter++;
  const events = s.events || [];
  const nEvents = events.length;
  const nSrc = s.numSources || 0;

  // Store ref for Groq callbacks
  window['_hs_'+pid] = s;

  // Build event cards
  let eventsHtml = '';
  events.forEach((ev, i) => {
    const evId = `ev-${pid}-${i}`;
    const hl = (ev.headlines||[])[0] || '';
    const srcLinks = (ev.sources||[]).map(a =>
      `<a href="${a.url}" target="_blank">${a.source||'Source'} <span class="src-arrow">→</span></a>`
    ).join('');
    const nSrc = (ev.sources||[]).length;

    // Store event data for Groq
    window['_ev_'+evId] = {
      city: s.city, country: s.country,
      categories: s.categories,
      headlines: ev.headlines || [],
      metadata: s.metadata || {},
      sources: ev.sources || [],
    };

    eventsHtml += `
      <div class="event-card">
        <div id="hl-${evId}" class="event-headline${hl?'':' loading'}">
          ${hl || '<span class="hl-loading">Generating headline</span>'}
        </div>
        <div class="event-sources">${srcLinks}</div>
        <div class="event-meta">${nSrc} source${nSrc!==1?'s':''}</div>
      </div>`;
  });

  // Fallback if no events
  if (!eventsHtml) {
    eventsHtml = '<div class="event-card"><div class="event-headline" style="color:var(--muted)">No events found</div></div>';
  }

  return `
    <div class="popup-header">
      <div><div class="popup-city">${s.city}</div><div class="popup-country">${s.country}</div></div>
      <span class="popup-badge" style="background:${bc};margin-left:auto">${s.categories?.[0]||'news'}</span>
    </div>
    <div class="events-list">${eventsHtml}</div>
    <div class="popup-meta">${nEvents} event${nEvents!==1?'s':''} · ${nSrc} source${nSrc!==1?'s':''}</div>`;
}

// ═══════════════════════════════════════════
// RENDER: DOTS MODE
// ═══════════════════════════════════════════
function renderDots(data,filter){
  markersLayer.clearLayers();
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
  const f=filter==='all'?data:data.filter(d=>d.categories.includes(filter));
  updateStats(f);
  const cg=L.markerClusterGroup({maxClusterRadius:40,spiderfyOnMaxZoom:true,showCoverageOnHover:false,
    zoomToBoundsOnClick:true,disableClusteringAtZoom:10,chunkedLoading:true,chunkInterval:100,chunkDelay:10});
  const ms=[];
  f.forEach(s=>{
    const col=getC(s.intensity,s.categories);
    const m=L.circleMarker([s.lat,s.lng],{radius:Math.max(getR(s.intensity)*.5,3),
      fillColor:col.b,fillOpacity:.65,color:col.b,weight:1,opacity:.8});
    const popupContent = buildPopup(s);
    m.bindPopup(popupContent,{maxWidth:320,minWidth:240});
    m._hotspotData = s;
    m._popupId = popupCounter - 1;  // buildPopup incremented it
    ms.push(m);
  });
  cg.addLayers(ms);
  markersLayer.addLayer(cg);
}

// ═══════════════════════════════════════════
// RENDER: HEATMAP MODE
// ═══════════════════════════════════════════
function renderHeat(data,filter){
  markersLayer.clearLayers();
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
  const f=filter==='all'?data:data.filter(d=>d.categories.includes(filter));
  updateStats(f);
  const pts=f.map(s=>[s.lat,s.lng,Math.max(s.intensity/100,.1)]);
  heatLayer=L.heatLayer(pts,{radius:25,blur:20,maxZoom:10,max:1,minOpacity:.3,
    gradient:{0:'#0a0e17',.15:'#1a237e',.3:'#1565c0',.45:'#2196f3',.55:'#4caf50',
      .65:'#ffeb3b',.75:'#ff9800',.85:'#f44336',.95:'#d50000',1:'#ff1744'}}).addTo(map);
  // Click regions
  const grp={};
  f.forEach(s=>{const k=Math.round(s.lat)+','+Math.round(s.lng);if(!grp[k])grp[k]={lat:0,lng:0,n:0,stories:[]};
    const g=grp[k];g.lat+=s.lat;g.lng+=s.lng;g.n++;if(g.stories.length<20)g.stories.push(s);});
  Object.values(grp).forEach(g=>{
    const la=g.lat/g.n,lo=g.lng/g.n;
    const cm=L.circleMarker([la,lo],{radius:18,fillOpacity:0,stroke:false,interactive:true});
    g.stories.sort((a,b)=>b.intensity-a.intensity);
    const items=g.stories.map(s=>{
      const bc=(CC[s.categories?.[0]]||DC).b;
      return `<li><span class="popup-badge" style="background:${bc};font-size:8px;padding:1px 5px;margin-right:3px">${s.categories?.[0]||''}</span><span style="color:var(--dim)">${s.headlines?.[0]||s.city}</span> <span style="color:var(--muted);font-size:9px">(${s.numSources||0})</span></li>`;
    }).join('');
    cm.bindPopup(`<div class="popup-header"><div><div class="popup-city">${g.stories[0]?.city||''}</div><div class="popup-country">${g.stories[0]?.country||''} — ${g.n} events</div></div></div><ul class="popup-story-list">${items}</ul>`,{maxWidth:380,maxHeight:320});
    markersLayer.addLayer(cm);
  });
}

// ═══════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════
function updateStats(f){
  const countries=new Set(f.map(d=>d.country));
  document.getElementById('sEvents').textContent=f.length.toLocaleString();
  document.getElementById('sSources').textContent=f.reduce((s,d)=>s+(d.numSources||d.numArticles||0),0).toLocaleString();
  document.getElementById('sCountries').textContent=countries.size;
}

// ═══════════════════════════════════════════
// RENDER DISPATCH
// ═══════════════════════════════════════════
function render(){
  if(viewMode==='heatmap') renderHeat(hotspotData,curCat);
  else renderDots(hotspotData,curCat);
}

// ═══════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════
async function loadData(){
  try{
    const r=await fetch(CONFIG.dataURL+'?t='+Date.now());
    const raw=await r.json();
    allData=(raw.hotspots||raw);
    hotspotData=allData.filter(d=>(d.numSources||d.numArticles||0)>=CONFIG.minSrc);
  }catch(e){console.error('Load failed:',e);hotspotData=allData=[];}
  render();
  updateLB();
  document.getElementById('sTime').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// ═══════════════════════════════════════════
// LEADERBOARD
// ═══════════════════════════════════════════
const CONTINENT_BOUNDS={
  'Africa':[[-35,-20],[37,52]],'Asia':[[-10,25],[55,145]],'Europe':[[35,-25],[72,45]],
  'North America':[[5,-170],[72,-50]],'South America':[[-56,-82],[13,-34]],'Oceania':[[-47,110],[0,180]]
};

function updateLB(){
  const f=curCat==='all'?hotspotData:hotspotData.filter(d=>d.categories.includes(curCat));
  const el=document.getElementById('lbList');
  if(lbMode==='continent'){
    const m={};
    f.forEach(d=>{const c=d.continent||'Other';if(!m[c])m[c]={n:0,s:0,co:new Set()};m[c].n++;m[c].s+=(d.numSources||d.numArticles||0);m[c].co.add(d.country);});
    const sorted=Object.entries(m).map(([k,v])=>({name:k,n:v.n,s:v.s,co:v.co.size})).sort((a,b)=>b.n-a.n);
    const mx=sorted[0]?.n||1;
    el.innerHTML=sorted.map((c,i)=>`<div class="lb-row" data-cont="${c.name}"><span class="lb-rank">${i+1}</span><span class="lb-name">${c.name}</span><span class="lb-val">${c.n.toLocaleString()}</span><div class="lb-bar-bg"><div class="lb-bar" style="width:${c.n/mx*100}%"></div></div></div>`).join('');
    el.querySelectorAll('.lb-row').forEach(r=>r.addEventListener('click',()=>{
      const b=CONTINENT_BOUNDS[r.dataset.cont];if(b)map.fitBounds(b,{padding:[30,30]});
    }));
  } else {
    const m={};
    f.forEach(d=>{const c=d.country||'?';if(!m[c])m[c]={n:0,s:0};m[c].n++;m[c].s+=(d.numArticles||d.numSources||0);});
    const sorted=Object.entries(m).map(([k,v])=>({name:k,n:v.n,s:v.s})).sort((a,b)=>b.n-a.n).slice(0,50);
    const mx=sorted[0]?.n||1;
    el.innerHTML=sorted.map((c,i)=>`<div class="lb-row" data-country="${c.name}"><span class="lb-rank">${i+1}</span><span class="lb-name">${c.name}</span><span class="lb-val">${c.n.toLocaleString()}</span><div class="lb-bar-bg"><div class="lb-bar" style="width:${c.n/mx*100}%"></div></div></div>`).join('');
    el.querySelectorAll('.lb-row').forEach(r=>r.addEventListener('click',()=>{
      const evts=hotspotData.filter(d=>d.country===r.dataset.country);
      if(evts.length){
        const lats=evts.map(d=>d.lat),lngs=evts.map(d=>d.lng);
        map.fitBounds([[Math.min(...lats)-1,Math.min(...lngs)-1],[Math.max(...lats)+1,Math.max(...lngs)+1]],{padding:[30,30],maxZoom:8});
      }
    }));
  }
}

// ═══════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════
// Category buttons
document.querySelectorAll('.cat-btn:not(.view-toggle)').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn:not(.view-toggle)').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');curCat=b.dataset.cat;render();updateLB();
  });
});
// View toggle
document.getElementById('viewBtn').addEventListener('click',()=>{
  const b=document.getElementById('viewBtn');
  if(viewMode==='dots'){viewMode='heatmap';b.textContent='◉ HEAT';b.style.cssText='border-color:#ef4444!important;color:#ef4444!important;background:rgba(239,68,68,.15)';}
  else{viewMode='dots';b.textContent='⬡ DOTS';b.style.cssText='';}
  render();
});
// Source slider
document.getElementById('srcSlider').addEventListener('input',e=>{
  const v=parseInt(e.target.value);document.getElementById('srcVal').textContent=v;
  CONFIG.minSrc=v;hotspotData=allData.filter(d=>(d.numSources||d.numArticles||0)>=v);render();updateLB();
});
// Leaderboard tabs
document.querySelectorAll('.lb-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.lb-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');lbMode=t.dataset.lb;updateLB();
  });
});
// Leaderboard collapse
document.getElementById('lbToggle').addEventListener('click',()=>{
  const lb=document.getElementById('lb');lb.classList.toggle('hidden');
  document.getElementById('lbToggle').textContent=lb.classList.contains('hidden')?'◀':'▶';
});

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
window.addEventListener('DOMContentLoaded',async()=>{
  initMap();await loadData();
  setTimeout(()=>document.getElementById('loader').classList.add('done'),800);
  if(CONFIG.dataURL)setInterval(loadData,CONFIG.refreshMs);
});
</script>
