<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World News Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e17;
    --bg-secondary: #111827;
    --bg-card: #1a2235;
    --text-primary: #e8ecf4;
    --text-secondary: #8896b0;
    --text-muted: #4a5568;
    --accent: #3b82f6;
    --border: #1e2d45;
    --cat-all: #3b82f6;
    --cat-conflict: #ef4444;
    --cat-politics: #8b5cf6;
    --cat-economy: #10b981;
    --cat-environment: #06b6d4;
    --cat-humanitarian: #f59e0b;
    --cat-health: #ec4899;
    --cat-positive: #22d3ee;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── Header ── */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: linear-gradient(180deg, rgba(10,14,23,0.97) 0%, rgba(10,14,23,0.85) 80%, rgba(10,14,23,0) 100%);
    padding: 16px 24px 28px;
    pointer-events: none;
  }

  #header-inner {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 20px rgba(59,130,246,0.3);
  }

  .logo-text {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  /* ── Category Tabs ── */
  #categories {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .cat-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .cat-btn:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }

  .cat-btn.active {
    color: #fff;
    border-color: transparent;
  }

  .cat-btn[data-cat="all"].active { background: var(--cat-all); box-shadow: 0 0 16px rgba(59,130,246,0.35); }
  .cat-btn[data-cat="conflict"].active { background: var(--cat-conflict); box-shadow: 0 0 16px rgba(239,68,68,0.35); }
  .cat-btn[data-cat="politics"].active { background: var(--cat-politics); box-shadow: 0 0 16px rgba(139,92,246,0.35); }
  .cat-btn[data-cat="economy"].active { background: var(--cat-economy); box-shadow: 0 0 16px rgba(16,185,129,0.35); }
  .cat-btn[data-cat="environment"].active { background: var(--cat-environment); box-shadow: 0 0 16px rgba(6,182,212,0.35); }
  .cat-btn[data-cat="humanitarian"].active { background: var(--cat-humanitarian); box-shadow: 0 0 16px rgba(245,158,11,0.35); }
  .cat-btn[data-cat="health"].active { background: var(--cat-health); box-shadow: 0 0 16px rgba(236,72,153,0.35); }
  .cat-btn[data-cat="positive"].active { background: var(--cat-positive); box-shadow: 0 0 16px rgba(34,211,238,0.35); }

  /* ── Map ── */
  #map {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    background: var(--bg-primary);
  }

  /* Dark map tiles */
  .leaflet-tile-pane { filter: brightness(0.6) contrast(1.15) saturate(0.2) hue-rotate(180deg) invert(1); }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { display: none !important; }

  /* ── Popup Styling ── */
  .leaflet-popup-content-wrapper {
    background: var(--bg-card) !important;
    color: var(--text-primary) !important;
    border-radius: 12px !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5) !important;
    min-width: 260px;
    max-width: 340px;
  }

  .leaflet-popup-tip { background: var(--bg-card) !important; border: 1px solid var(--border) !important; }

  .leaflet-popup-close-button {
    color: var(--text-secondary) !important;
    font-size: 18px !important;
    top: 8px !important;
    right: 10px !important;
  }

  .popup-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .popup-city {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
  }

  .popup-country {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .popup-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .popup-stats {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .popup-stat {
    text-align: center;
    flex: 1;
  }

  .popup-stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
  }

  .popup-stat-label {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .popup-articles { list-style: none; }

  .popup-articles li {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(30,45,69,0.5);
  }

  .popup-articles li:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .popup-articles a {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 12.5px;
    line-height: 1.4;
    display: block;
    transition: color 0.2s;
  }

  .popup-articles a:hover { color: var(--accent); }

  .popup-source {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Topic Sections ── */
  .popup-topics {
    margin-bottom: 10px;
  }

  .popup-topic {
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,45,69,0.5);
  }

  .popup-topic:last-child { border-bottom: none; }

  .popup-topic-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .popup-topic-summary {
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--text-secondary);
  }

  /* ── Legend ── */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(26,34,53,0.92);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 11px;
  }

  #legend h4 {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-label { color: var(--text-secondary); }

  /* ── Info Panel ── */
  #info-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    background: rgba(26,34,53,0.92);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 11px;
    text-align: right;
  }

  #info-panel .stat-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 4px;
  }

  #info-panel .stat-value {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--accent);
  }

  #info-panel .stat-label { color: var(--text-secondary); }

  #info-panel .update-time {
    color: var(--text-muted);
    font-size: 10px;
    margin-top: 6px;
  }

  /* ── Loading ── */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }

  #loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader {
    width: 48px; height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loader-text {
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    #header { padding: 10px 14px 20px; }
    #categories { gap: 4px; }
    .cat-btn { font-size: 10px; padding: 5px 10px; }
    #legend { bottom: 10px; left: 10px; padding: 10px 14px; }
    #info-panel { bottom: 10px; right: 10px; padding: 10px 14px; }
  }

  /* ── Cluster Markers ── */
  .marker-cluster {
    background: rgba(59,130,246,0.25) !important;
    border: 2px solid rgba(59,130,246,0.5) !important;
  }
  .marker-cluster div {
    background: rgba(59,130,246,0.7) !important;
    color: #fff !important;
    font-family: 'Space Mono', monospace !important;
    font-size: 11px !important;
    font-weight: 700 !important;
  }
  .marker-cluster-small {
    background: rgba(59,130,246,0.2) !important;
  }
  .marker-cluster-small div {
    background: rgba(59,130,246,0.6) !important;
  }
  .marker-cluster-medium {
    background: rgba(245,158,11,0.2) !important;
  }
  .marker-cluster-medium div {
    background: rgba(245,158,11,0.6) !important;
  }
  .marker-cluster-large {
    background: rgba(239,68,68,0.25) !important;
  }
  .marker-cluster-large div {
    background: rgba(239,68,68,0.7) !important;
  }
</style>
</head>

<!-- Loading -->

    <span class="legend-label">High attention</span>
  </div>
</div>

<!-- Info Panel -->
<div id="info-panel">
  <div class="stat-row">
    <span class="stat-label">Hotspots</span>

  <div class="stat-row">

  <div class="stat-row">

    <span class="stat-value" id="stat-countries">0</span>
  </div>
  <div class="update-time" id="update-time">Loading...</div>
</div>

      { title: "Lebanon's banking crisis deepens as currency hits new low", url: "#", source: "Reuters", lang: "en" },
      { title: "UN agencies warn of growing humanitarian needs in Lebanon", url: "#", source: "UNHCR", lang: "en" },
    ]
  },
];

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let map;
let markersLayer;
let currentCategory = 'all';
let hotspotData = [];

// ══════════════════════════════════════════════════
// INIT MAP
// ══════════════════════════════════════════════════
function initMap() {
  map = L.map('map', {
    center: [20, 15],
    zoom: 3,
    minZoom: 2,
    maxZoom: 12,
    zoomControl: false,
    attributionControl: false,
    worldCopyJump: true,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
}

// ══════════════════════════════════════════════════
// INTENSITY → VISUAL MAPPING
// ══════════════════════════════════════════════════
function getRadius(intensity) {
  // Logarithmic scale so top stories clearly dominate
  // but smaller ones remain visible. sqrt gives a nice spread.
  // intensity 1-100 → radius 5-32
  if (intensity <= 0) return 5;
  return 5 + Math.sqrt(intensity / 100) * 27;
}

function getColor(intensity, categories) {
  // Use the first category's color, or blend toward red for high intensity
  const cat = categories && categories[0];
  const catColor = CAT_COLORS[cat] || DEFAULT_COLOR;

  if (intensity > 75) {
    return { base: lerpColor(catColor.base, '#ef4444', (intensity - 75) / 25), glow: catColor.glow };
  }
  return catColor;
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.replace('#',''), 16);
  const bh = parseInt(b.replace('#',''), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return `#${((1 << 24) + (rr << 16) + (rg << 8) + rb).toString(16).slice(1)}`;
}

// ══════════════════════════════════════════════════
// RENDER MARKERS
// ══════════════════════════════════════════════════
function renderMarkers(data, filter) {
  markersLayer.clearLayers();

  const filtered = filter === 'all'
    ? data
    : data.filter(d => d.categories.includes(filter));

  // Update stats
  const countries = new Set(filtered.map(d => d.country));
  const totalSources = filtered.reduce((s, d) => s + d.numSources, 0);
  document.getElementById('stat-hotspots').textContent = filtered.length.toLocaleString();
  document.getElementById('stat-sources').textContent = totalSources.toLocaleString();
  document.getElementById('stat-countries').textContent = countries.size;

  // Use MarkerClusterGroup for performance with thousands of markers
  const clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 40,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    disableClusteringAtZoom: 10,
    chunkedLoading: true,
    chunkInterval: 100,
    chunkDelay: 10,
  });

  const markers = [];
  filtered.forEach((spot) => {
    const colors = getColor(spot.intensity, spot.categories);
    const radius = getRadius(spot.intensity);

    // Core dot only (no glow rings for individual events — too many)
    const marker = L.circleMarker([spot.lat, spot.lng], {
      radius: Math.max(radius * 0.5, 4), // Smaller dots since there are thousands
      fillColor: colors.base,
      fillOpacity: 0.65,
      color: colors.base,
      weight: 1,
      opacity: 0.8,
    });

    // Build popup with summary
    const badgeColor = CAT_COLORS[spot.categories[0]]?.base || DEFAULT_COLOR.base;
    const toneLabel = spot.avgTone > 2 ? '▲ Positive' : spot.avgTone < -2 ? '▼ Negative' : '● Neutral';
    const toneColor = spot.avgTone > 2 ? '#22d3ee' : spot.avgTone < -2 ? '#ef4444' : '#8896b0';

    // Summary line
    const summaryHTML = spot.summary
      ? `<div class="popup-topic-summary" style="margin-bottom:10px;">${spot.summary}</div>`
      : '';

    // Article links
    const articles = spot.articles || [];
    let articlesHTML = '';
    if (articles.length > 0) {
      const items = articles.map(a => `
        <li>
          <a href="${a.url}" target="_blank" rel="noopener">${a.title}</a>
          <div class="popup-source">${a.source}${a.lang !== 'en' ? ' · ' + a.lang.toUpperCase() : ''}</div>
        </li>`).join('');
      articlesHTML = `<ul class="popup-articles">${items}</ul>`;
    }

    const popup = `
      <div class="popup-header">
        <div>
          <div class="popup-city">${spot.city}</div>
          <div class="popup-country">${spot.country}</div>
        </div>
        <span class="popup-badge" style="background:${badgeColor};margin-left:auto;">
          ${spot.categories[0]}
        </span>
      </div>
      <div class="popup-stats">
        <div class="popup-stat">
          <div class="popup-stat-value">${spot.numSources}</div>
          <div class="popup-stat-label">Sources</div>
        </div>
        <div class="popup-stat">
          <div class="popup-stat-value" style="color:${toneColor}">${toneLabel}</div>
          <div class="popup-stat-label">Tone</div>
        </div>
      </div>
      ${summaryHTML}
      ${articlesHTML}
    `;

    marker.bindPopup(popup, { maxWidth: 340 });
    markers.push(marker);
  });

  clusterGroup.addLayers(markers);
  markersLayer.addLayer(clusterGroup);
}

// ══════════════════════════════════════════════════
// DATA LOADING
// ══════════════════════════════════════════════════
async function loadData() {
  if (CONFIG.dataURL) {
    try {
      const res = await fetch(CONFIG.dataURL + '?t=' + Date.now());
      const raw = await res.json();
      // Data is wrapped in an envelope with a "hotspots" key
      const data = raw.hotspots || raw;
      // Apply minimum sources filter
      hotspotData = data.filter(d => d.numSources >= CONFIG.minSources);
    } catch (err) {
      console.error('Failed to fetch live data, using demo:', err);
      hotspotData = DEMO_DATA;
    }
  } else {
    hotspotData = DEMO_DATA;
  }

  renderMarkers(hotspotData, currentCategory);
  document.getElementById('update-time').textContent =
    'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ══════════════════════════════════════════════════
// CATEGORY BUTTONS
// ══════════════════════════════════════════════════
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.cat;
    renderMarkers(hotspotData, currentCategory);
  });
});

// ══════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  initMap();
  await loadData();

  // Hide loader
  setTimeout(() => {
    document.getElementById('loading-overlay').classList.add('hidden');
  }, 800);

  // Auto-refresh if live
  if (CONFIG.dataURL) {
    setInterval(loadData, CONFIG.refreshInterval);
  }
});
</script>
</body>
</html>
