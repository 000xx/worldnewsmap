name: Update World News Map

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline
        env:
          NEWSMAP_MIN_SOURCES: '5'
          NEWSMAP_MAX_AGE_HOURS: '36'
          NEWSMAP_NUM_DAYS: '3'
          NEWSMAP_MAX_ENRICH: '40'
          NEWSMAP_MAX_HOTSPOTS: '10000'
          NEWSMAP_OUTPUT: '../data/live.json'
          NEWSMAP_RSS_DELAY: '1.5'
          # Uncomment and add your Guardian API key as a repository secret:
          # GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          cd pipeline
          python orchestrator.py

      - name: Commit and push updated data
        run: |
          git config user.name "World News Map Bot"
          git config user.email "bot@worldnewsmap.dev"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Update live data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
