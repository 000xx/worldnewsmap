name: Update World News Map

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pipeline
        env:
          NEWSMAP_MIN_SOURCES: '3'
          NEWSMAP_MAX_AGE_HOURS: '36'
          NEWSMAP_NUM_DAYS: '3'
          NEWSMAP_OUTPUT: '../data/live.json'
          NEWSMAP_API_DELAY: '0.5'
        run: |
          cd pipeline
          python orchestrator.py

      - name: Commit and push updated data
        run: |
          git config user.name "World News Map Bot"
          git config user.email "bot@worldnewsmap.dev"
          git add data/live.json
          git diff --cached --quiet || git commit -m "Update live data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
